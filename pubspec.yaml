name: muyu_app
description: "Muyu: farmers and merchants financing plots through escrow."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.2
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/urbanist_light.ttf
          weight: 300
        - asset: assets/fonts/urbanist_regular.ttf
          weight: 400
        # Same mapping as Type.kt in the Kotlin app.
        - asset: assets/fonts/urbanist_semibold.ttf
          weight: 500
        - asset: assets/fonts/urbanist_semibold.ttf
          weight: 600
        - asset: assets/fonts/urbanist_bold.ttf
          weight: 700
        - asset: assets/fonts/urbanist_extrabold.ttf
          weight: 800
        - asset: assets/fonts/urbanist_extrabold.ttf
          weight: 900
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka_semibold.ttf
          weight: 600
